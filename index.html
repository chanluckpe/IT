<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="통역 비서">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>내 통역 비서</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: mobile-only messenger-style one-screen app — top bar, Korean⇄English banner, chat bubbles, floating live card, thumb-zone mic dock */
:root{
  --bg:#f4f5fb; --surface:#ffffff; --surface-2:#eceef6; --ink:#141725; --muted:#6a7086; --line:#e2e5ef;
  --brand:#3550e6; --brand-ink:#ffffff; --brand-soft:#e6eaff;
  --rec:#ef4136; --ok:#13a374;
    --shadow:0 6px 24px rgba(30,40,90,.10), 0 1px 3px rgba(30,40,90,.08);
  --f:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11131b; --surface:#1b1e2a; --surface-2:#252937; --ink:#eef0f7; --muted:#9aa0b6; --line:#2c3040;
  --brand:#6f86ff; --brand-ink:#0d1030; --brand-soft:#262c4d;
  --rec:#ff5a4f; --ok:#3fd19f;
    --shadow:0 6px 24px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);-webkit-tap-highlight-color:transparent;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,textarea{-webkit-user-select:text;user-select:text}
.bubble .tr,.big-tr{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.app{height:var(--app-h,100dvh);max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);position:relative}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding-block:12px 4px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);font-weight:800;font-size:15px;flex:none}
.top h1{margin:0;font-size:18px;font-weight:750;letter-spacing:-.02em;flex:1}
.ghost{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.ghost:active{background:var(--surface-2)}
.ghost svg{width:22px;height:22px}

/* direction banner */
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--surface);border-radius:18px;padding:12px 10px;box-shadow:0 1px 2px rgba(30,40,90,.06)}
.side-lang{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;border-radius:12px;padding:6px 4px;border:2px solid transparent;transition:background .2s,border-color .2s}
.side-lang.active{border-color:var(--rec);background:color-mix(in srgb,var(--rec) 8%,transparent)}
.side-lang.active.en-side{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px}
.sheet .pair{background:var(--bg);box-shadow:none}
.sheet .modes button[aria-checked="true"]{background:var(--brand);color:var(--brand-ink)}
.sheet .modes button[aria-checked="true"] small{opacity:.85}
.modes button{border:0;background:transparent;height:42px;border-radius:11px;font-weight:700;font-size:14.5px;color:var(--muted);display:grid;line-height:1.15;align-content:center}
.modes button small{font-size:11px;font-weight:500}
.modes button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(30,40,90,.14)}
.flagdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex:none}
.flagdot.ko{background:var(--brand)}.flagdot.en{background:var(--ok)}
.swap{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.swap svg{width:18px;height:18px}

/* chat */
.chat{flex:1;min-height:0;overflow-y:auto;padding-block:10px 14px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.row{display:flex;flex-direction:column;max-width:88%;min-width:0;animation:pop .22s ease-out}
.row.me{align-self:flex-end;align-items:flex-end}
.row.them{align-self:flex-start;align-items:flex-start}
@keyframes pop{from{transform:translateY(6px);opacity:.4}}
.who{font-size:12px;color:var(--muted);margin:0 6px 4px;font-weight:600}
.bubble{border-radius:20px;padding:11px 15px 12px;display:grid;gap:6px;min-width:0;max-width:100%}
.me .bubble{background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:6px}
.them .bubble{background:var(--surface);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(30,40,90,.07)}
.orig{font-size:14px;opacity:.78;overflow-wrap:anywhere;line-height:1.45}
.tr{font-size:20px;font-weight:650;line-height:1.38;overflow-wrap:anywhere;letter-spacing:-.01em}
.tr.wait{font-size:15px;font-weight:500;opacity:.75}
.tr.err{font-size:14px;font-weight:500}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:4px;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.2}}
.acts{display:flex;gap:4px;margin-top:4px}
.act{border:0;background:var(--surface);border-radius:999px;height:36px;padding:0 12px;display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);box-shadow:0 1px 2px rgba(30,40,90,.06)}
.act svg{width:15px;height:15px}
.act:active{color:var(--ink);transform:scale(.96)}

/* welcome */
.welcome{background:var(--surface);border-radius:22px;padding:20px 18px;box-shadow:var(--shadow);display:grid;gap:14px;margin-top:6px}
.welcome h2{margin:0;font-size:19px;letter-spacing:-.02em}
.welcome p{margin:0;color:var(--muted);font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;font-size:14.5px}
.steps .n{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800}
.tip{background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}

/* live card */
.live{flex:none;margin:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:12px 16px 14px;display:grid;gap:4px;z-index:5;border:2px solid var(--rec)}
.live.them-mode{border-color:var(--ok)}
.live-head{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;color:var(--rec)}
.live.them-mode .live-head{color:var(--ok)}
.bars{display:flex;gap:3px;align-items:center;height:16px}
.bars i{width:3px;border-radius:2px;background:currentColor;height:30%;animation:eq 1s infinite ease-in-out}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}.bars i:nth-child(4){animation-delay:.1s}
@keyframes eq{50%{height:100%}}
.live-turn{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.live-src{font-size:15px;color:var(--muted);overflow-wrap:anywhere;min-height:1.3em}
.live-dst{font-size:18px;font-weight:650;overflow-wrap:anywhere}

/* dock */
.dock{flex:none;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:18px;background:var(--bg)}
.dock-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.side{display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);border:0;background:none;padding:0}
.side .circ{width:54px;height:54px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-weight:800;font-size:20px;transition:transform .15s}
.side:active .circ{transform:scale(.94)}
.side .circ svg{width:24px;height:24px;color:var(--ink)}
.side.on .circ{background:var(--ok);color:#fff}
.mic{width:86px;height:86px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;position:relative;
  box-shadow:0 10px 26px color-mix(in srgb,var(--brand) 45%,transparent);transition:transform .15s,background .2s}
.mic:active{transform:scale(.95)}
.mic svg{width:36px;height:36px}
.mic.on{background:var(--rec);box-shadow:0 10px 26px color-mix(in srgb,var(--rec) 45%,transparent)}
.mic.on::before,.mic.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--rec);animation:ring 1.6s infinite ease-out}
.mic.on::after{animation-delay:.8s}
@keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(1.35);opacity:0}}
.mic-label{text-align:center;font-size:13px;font-weight:700;margin-top:8px;color:var(--ink)}
.mic-wrap{display:grid;justify-items:center}
.typebar{display:flex;gap:8px;margin-bottom:12px}
.typebar input{flex:1;min-width:0;height:50px;font-size:16px!important;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit}
.typebar button{height:48px;border-radius:14px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;padding:0 18px}

/* big view */
.big{position:fixed;inset:0;background:var(--surface);z-index:30;display:grid;grid-template-rows:auto 1fr auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.big.flip .big-body{transform:rotate(180deg)}
.big-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--muted);font-size:14px}
.big-body{display:grid;align-content:center;gap:18px;text-align:center;transition:transform .3s}
.big-tr{font-size:clamp(30px,8vw,52px);font-weight:750;line-height:1.3;overflow-wrap:anywhere;letter-spacing:-.02em}
.big-orig{font-size:17px;color:var(--muted);overflow-wrap:anywhere}
.big-acts{display:flex;gap:10px;justify-content:center}
.pill{height:50px;border-radius:999px;border:0;padding:0 22px;font-weight:700;background:var(--surface-2);display:flex;align-items:center;gap:8px}
.pill.primary{background:var(--brand);color:var(--brand-ink)}
.pill svg{width:20px;height:20px}

/* settings sheet */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:480px;max-height:88dvh;overscroll-behavior:contain;transition:transform .2s;border-radius:24px 24px 0 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,25,.45)}
.sheet{padding:10px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:18px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto;box-shadow:0 0 0 14px transparent;touch-action:none}
.sheet h2{margin:0;font-size:20px;letter-spacing:-.02em}
.group{display:grid;gap:8px}
.group > .lab{font-size:13px;font-weight:700;color:var(--muted)}
.input{width:100%;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:12px;font:inherit;font-size:16px}
textarea.input{min-height:80px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.switch{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;background:var(--bg);border-radius:14px}
.switch span{font-size:14.5px;font-weight:600}.switch small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.switch input{appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--brand)}.switch input:checked::after{transform:translateX(20px)}
.rate{display:flex;align-items:center;gap:12px}.rate input{flex:1;accent-color:var(--brand)}
.rate b{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.voices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.voices div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between}
.voices em{font-style:normal;font-weight:700}.voices .y{color:var(--ok)}.voices .n{color:var(--muted)}
.danger{border:0;background:none;color:var(--rec);font-weight:700;padding:10px 0;text-align:left}
.done{height:52px;border-radius:14px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:750;font-size:16px}

/* toast */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;transition:transform .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}

.app.kb .dock-inner{display:none}
.app.kb .typebar{margin-bottom:0}
.app.kb .top{padding-block:6px 2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top gut">
    <div class="logo" aria-hidden="true">통</div>
    <h1>내 통역 비서</h1>
    <button class="ghost" id="clearBtn" type="button" aria-label="대화 지우기" title="대화 지우기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
    </button>
    <button class="ghost" id="openSettings" type="button" aria-label="설정" title="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main class="chat gut" id="chat" aria-live="polite"></main>

  <section class="live" id="live" hidden aria-live="polite">
    <div class="live-head"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="liveHead">듣고 있어요</span></div>
    <div class="live-src" id="liveSrc">편하게 말씀하세요…</div>
    <div class="live-dst" id="liveDst"></div>
  </section>

  <footer class="dock gut">
    <form class="typebar" id="typeForm" hidden>
      <input id="typeInput" placeholder="한국어로 입력하세요" autocomplete="off" enterkeyhint="send">
      <button type="submit">통역</button>
    </form>
    <div class="dock-inner">
      <button class="side" id="kbBtn" type="button">
        <span class="circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></span><span>글자 입력</span>
      </button>
      <div class="mic-wrap">
        <button class="mic" id="micBtn" type="button" aria-label="말하기 시작">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
        </button>
        <div class="mic-label" id="micLabel">눌러서 말하기</div>
      </div>
      <button class="side" id="themBtn" type="button">
        <span class="circ" id="themGlyph" style="color:var(--ok)">EN</span><span id="themLabel">영어 듣기</span>
      </button>
    </div>
  </footer>
</div>

<div class="big" id="big" hidden role="dialog" aria-label="크게 보기">
  <div class="big-top"><span id="bigLang">English</span><button class="ghost" id="bigClose" type="button" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="big-body"><div class="big-tr" id="bigTr"></div><div class="big-orig" id="bigOrig"></div></div>
  <div class="big-acts">
    <button class="pill" id="bigFlip" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>뒤집기</button>
    <button class="pill primary" id="bigPlay" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>들려주기</button>
  </div>
</div>

<dialog id="settings">
  <form method="dialog" class="sheet">
    <div class="grab" aria-hidden="true"></div>
    <h2>설정</h2>

    <div class="group">
      <span class="lab">통역 언어</span>
      <div class="pair">
        <div class="side-lang" id="sideKo"><span class="flagdot ko">KO</span>한국어</div>
        <span class="swap" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h15l-4-4M20 16H5l4 4"/></svg></span>
        <div class="side-lang en-side" id="sideEn"><span class="flagdot en">EN</span>English</div>
      </div>
    </div>

    <div class="group">
      <span class="lab">대화 방식</span>
      <div class="modes" role="radiogroup" aria-label="통역 모드">
        <button type="button" role="radio" data-mode="auto">자동 대화<small>차례를 알아서 바꿔요</small></button>
        <button type="button" role="radio" data-mode="manual">직접 선택<small>버튼으로 골라요</small></button>
      </div>
    </div>

    <div class="group">
      <span class="lab">통역 음성 속도</span>
      <div class="rate"><span>느리게</span><input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1"><span>빠르게</span><b id="rateVal">1.0×</b></div>
    </div>

    <div class="group">
      <span class="lab">문장이 끝났다고 판단할 멈춤 시간</span>
      <div class="rate"><span>짧게</span><input id="gap" type="range" min="0.6" max="2.5" step="0.1" value="1"><span>길게</span><b id="gapVal">1.0초</b></div>
      <p class="hint">말하다 잠깐 멈췄는데 문장이 중간에 끊기면 길게, 통역이 늦게 나오면 짧게 조절하세요.</p>
    </div>

    <label class="switch"><span>대화 맥락 반영<small>앞에서 나눈 대화를 함께 보내서, 생략된 주어나 짧은 대답도 흐름에 맞게 번역해요</small></span><input type="checkbox" id="ctxOn"></label>
    <label class="switch"><span>실시간 미리보기<small>말하는 동안 문장 전체의 번역을 미리 보여줘요</small></span><input type="checkbox" id="liveOn"></label>
    <label class="switch"><span>에코 방지<small>통역 음성이 나오는 동안 마이크를 잠시 멈춰요. 이어폰을 쓰면 꺼도 돼요</small></span><input type="checkbox" id="echoGuard"></label>

    <div class="group">
      <span class="lab">이 기기의 음성</span>
      <div class="voices" id="voiceList"></div>
    </div>

    <button class="done" value="ok">완료</button>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const LANGS = { en: { glyph:'EN', name:'영어', native:'English', stt:'en-US', tts:'en-US', g:'en' } };
  const KO = { name:'한국어', native:'한국어', stt:'ko-KR', tts:'ko-KR', g:'ko' };
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d){ try { const v = localStorage.getItem('interp.'+k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v){ try { localStorage.setItem('interp.'+k, JSON.stringify(v)); } catch {} },
  };
  const S = Object.assign({ rate:1, gap:1, liveOn:true, echoGuard:true, convMode:'auto', ctxOn:true }, store.get('settings', {}));
  for (const k of ['engine','apiKey','model','tone','glossary','target']) delete S[k];
  const save = () => store.set('settings', S);
  const T = () => LANGS.en;
  const isAuto = () => S.convMode === 'auto';

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }


  /* ---------- chat ---------- */
  const chat = $('chat');
  // keep the latest message in view whenever the chat area changes size (live card grows, keyboard opens)
  let stick = true;
  chat.addEventListener('scroll', () => { stick = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60; }, { passive:true });
  new ResizeObserver(() => { if (stick && !chat.querySelector('.welcome')) chat.scrollTop = chat.scrollHeight; }).observe(chat);
  const ICON = {
    play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
    big:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
    copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  };
  function welcome(){
    chat.innerHTML = `
      <section class="welcome">
        <div><h2>안녕하세요! 무엇이든 말해보세요</h2><p>한국어로 말하면 영어로 바로 들려드려요.</p></div>
        ${isAuto() ? `<ol class="steps">
          <li><span class="n">1</span><span><b>대화 시작</b>을 누르고 한국어로 말해요</span></li>
          <li><span class="n">2</span><span>말을 멈추면 <b>영어 음성</b>이 나오고, 마이크가 자동으로 <b>영어 듣기</b>로 바뀌어요</span></li>
          <li><span class="n">3</span><span>상대방이 말을 마치면 한국어로 들려주고 다시 <b>내 차례</b>로 돌아와요</span></li>
        </ol>
        <div class="tip">차례가 어긋나면 오른쪽 <b>차례 바꾸기</b>를 누르세요. 대화 중 아래 카드가 빨간색이면 내 차례, 초록색이면 상대방 차례예요. 대화 방식은 오른쪽 위 설정에서 바꿀 수 있어요.</div>`
        : `<ol class="steps">
          <li><span class="n">1</span><span>파란 <b>마이크 버튼</b>을 누르고 한국어로 말해요</span></li>
          <li><span class="n">2</span><span>문장이 끝날 때마다 <b>영어 음성</b>이 나와요</span></li>
          <li><span class="n">3</span><span>상대방이 영어로 말할 땐 오른쪽 <b>영어 듣기</b>를 눌러요</span></li>
        </ol>
        <div class="tip">번역된 말풍선의 <b>크게 보기</b>를 누르면 화면 가득 영어 문장을 띄워 상대에게 보여줄 수 있어요.</div>`}
      </section>`;
  }
  function addTurn(who, src){
    chat.querySelector('.welcome')?.remove();
    const from = who === 'me' ? KO : T(), to = who === 'me' ? T() : KO;
    const row = document.createElement('div');
    row.className = 'row ' + who;
    row.innerHTML = `<div class="who"></div><div class="bubble"><div class="orig"></div><div class="tr wait"><span class="typing"><i></i><i></i><i></i></span>통역 중</div></div><div class="acts" hidden></div>`;
    row.querySelector('.who').textContent = who === 'me' ? `나 · ${to.native}` : `상대방 · ${from.native}`;
    row.querySelector('.orig').textContent = src;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    const tr = row.querySelector('.tr'), acts = row.querySelector('.acts');
    return {
      set(text){
        tr.className = 'tr'; tr.textContent = text;
        acts.hidden = false;
        acts.innerHTML = `<button class="act" type="button" data-a="play">${ICON.play}다시 듣기</button><button class="act" type="button" data-a="big">${ICON.big}크게 보기</button><button class="act" type="button" data-a="copy">${ICON.copy}복사</button>`;
        acts.onclick = e => {
          const a = e.target.closest('button')?.dataset.a;
          if (a === 'play') speak(text, to.tts);
          if (a === 'big') openBig(text, src, to);
          if (a === 'copy') navigator.clipboard?.writeText(text).then(() => toast('복사했어요'), () => toast('복사하지 못했어요'));
        };
        chat.scrollTop = chat.scrollHeight;
      },
      fail(msg){ tr.className = 'tr err'; tr.textContent = '⚠ ' + msg; },
    };
  }
  $('clearBtn').onclick = () => { welcome(); convo.length = 0; toast('대화를 지웠어요'); };

  /* ---------- big view ---------- */
  let bigData = null;
  function openBig(text, src, to){
    bigData = { text, tts: to.tts };
    $('bigTr').textContent = text; $('bigOrig').textContent = src; $('bigLang').textContent = to.native;
    $('big').classList.remove('flip'); $('big').hidden = false;
  }
  $('bigClose').onclick = () => { $('big').hidden = true; };
  $('bigFlip').onclick = () => $('big').classList.toggle('flip');
  $('bigPlay').onclick = () => bigData && speak(bigData.text, bigData.tts);

  /* ---------- translation ---------- */
  /* ---------- conversation context ----------
     The free translator handles one text at a time, so we send the last few lines of the
     conversation together with the new sentence (all written in the speaker's language),
     then keep only the translation of the last line. Omitted subjects and short replies
     ("네, 그거요", "거기서요") then read in the flow of the conversation. */
  const convo = [];                 // { who, src, out, t }
  const CTX_TURNS = 3, CTX_AGE = 5 * 60 * 1000;
  const oneLine = t => t.replace(/\s*\n+\s*/g, ' ').trim();
  function contextFor(from){
    const now = Date.now();
    return convo.filter(h => now - h.t < CTX_AGE).slice(-CTX_TURNS)
      // show every earlier line in the current speaker's language: originals for their side, translations for the other side
      .map(h => from === KO ? (h.who === 'me' ? h.src : h.out) : (h.who === 'me' ? h.out : h.src))
      .filter(Boolean).map(oneLine);
  }
  async function translateInContext(text, from, to){
    const ctx = S.ctxOn ? contextFor(from) : [];
    if (!ctx.length) return translate(text, from, to);
    try {
      const out = await translate([...ctx, oneLine(text)].join('\n'), from, to);
      const lines = out.split('\n').map(x => x.trim()).filter(Boolean);
      if (lines.length === ctx.length + 1 && lines[lines.length - 1]) return lines[lines.length - 1];
    } catch {}
    return translate(text, from, to);   // line split didn't line up: fall back to the sentence on its own
  }
  async function translate(text, from, to, signal){
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from.g}&tl=${to.g}&dt=t&q=${encodeURIComponent(text)}`;
    const r = await fetch(url, { signal });
    if (!r.ok) throw new Error('번역 서버가 응답하지 않아요. 잠시 후 다시 해보세요');
    const j = await r.json();
    return (j[0] || []).map(x => x[0]).join('');
  }

  /* ---------- speech output ---------- */
  const synth = window.speechSynthesis;
  let voices = [];
  function loadVoices(){ voices = synth ? synth.getVoices() : []; drawVoices(); }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  function pickVoice(tag){
    const norm = v => v.lang.replace('_','-');
    const list = voices.filter(v => norm(v).toLowerCase().startsWith(tag.slice(0,2).toLowerCase()));
    return list.find(v => norm(v) === tag && /google|premium|enhanced|natural/i.test(v.name)) || list.find(v => norm(v) === tag) || list[0] || null;
  }
  function drawVoices(){
    const box = $('voiceList'); if (!box) return; box.innerHTML = '';
    for (const L of [...Object.values(LANGS), KO]) {
      const ok = !!pickVoice(L.tts);
      const d = document.createElement('div');
      d.innerHTML = `<span>${L.name}</span><em class="${ok ? 'y' : 'n'}">${ok ? '기기 음성' : '온라인 음성'}</em>`;
      box.appendChild(d);
    }
  }
  let speaking = 0, audioBusy = false;
  const audioQ = [];
  function speakStart(){ speaking++; paint(); if (S.echoGuard && listening && rec && !switching) { pausedForTts = true; try { rec.abort(); } catch {} } }
  function speakEnd(){ speaking = Math.max(0, speaking - 1); paint(); if (!speaking && pausedForTts && !switching) { pausedForTts = false; if (listening) startRec(); } }
  function speak(text, tag){
    if (!text) return;
    const v = pickVoice(tag);
    if (synth && v) {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = v; u.lang = v.lang; u.rate = S.rate;
      let started = false;
      u.onstart = () => { started = true; speakStart(); };
      u.onend = u.onerror = () => { if (started) { started = false; speakEnd(); } };
      synth.speak(u);
    } else {
      for (const chunk of chunkText(text, 180)) audioQ.push({ chunk, tl: tag.slice(0,2) });
      pumpAudio();
    }
  }
  function chunkText(t, n){
    const out = []; let cur = '';
    for (const part of t.split(/(?<=[.!?。！？,，、\s])/)) { if ((cur + part).length > n && cur) { out.push(cur); cur = ''; } cur += part; }
    if (cur.trim()) out.push(cur);
    return out;
  }
  function pumpAudio(){
    if (audioBusy || !audioQ.length) return;
    audioBusy = true;
    const { chunk, tl } = audioQ.shift();
    const a = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${tl}&q=${encodeURIComponent(chunk)}`);
    a.playbackRate = S.rate;
    speakStart();
    const done = () => { speakEnd(); audioBusy = false; pumpAudio(); };
    a.onended = done; a.onerror = done; a.play().catch(done);
  }

  /* ---------- speech input ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, mode = 'me', pausedForTts = false;
  let switching = false, turnTimer = null, heardThisTurn = false, held = [];
  // sentence buffer: words are collected here and translated once, after the speaker pauses
  let utter = { finals:'', interim:'' }, sentTimer = null;
  const gapMs = () => Math.round((S.gap || 1) * 1000);
  let liveCtl = null, liveTimer = null, liveSeq = 0;
  const pair = m => m === 'me' ? { from: KO, to: T() } : { from: T(), to: KO };

  function startRec(){
    if (!SR) return;
    const { from } = pair(mode);
    const me = rec = new SR();
    utter = { finals:'', interim:'' }; clearTimeout(sentTimer);
    rec.lang = from.stt; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onresult = e => { if (rec === me) onResult(e); };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { stopAll(); toast('마이크 권한을 허용해 주세요'); }
      else if (e.error === 'language-not-supported') { stopAll(); toast(`이 기기는 ${from.name} 음성 인식을 지원하지 않아요`); }
    };
    rec.onend = () => { if (listening && !pausedForTts && !switching && rec === me) { try { rec.start(); } catch { setTimeout(startRec, 150); } } };
    try { rec.start(); } catch {}
    paint();
  }
  // Phones often resend the whole sentence-so-far as each new "final" piece ("안녕", "안녕하세요", "안녕하세요 체크인…").
  // Merge those so every word appears once.
  const norm = t => t.replace(/[\s.,!?。]+/g, '').toLowerCase();
  function merge(acc, t){
    if (!t) return acc; if (!acc) return t;
    const a = norm(acc), b = norm(t);
    if (b.startsWith(a)) return t;          // t repeats acc and adds more
    if (a.includes(b)) return acc;          // t already said
    return acc + ' ' + t;
  }
  const currentText = () => merge(utter.finals, utter.interim).trim();
  function onResult(e){
    let finals = '', interim = '';
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i], t = r[0].transcript.trim();
      if (!t) continue;
      if (r.isFinal) finals = merge(finals, t); else interim = merge(interim, t);
    }
    utter = { finals, interim };
    const text = currentText();
    $('liveSrc').textContent = text || placeholder();
    if (text) scheduleLive(text); else $('liveDst').textContent = '';
    clearTimeout(sentTimer); clearTimeout(turnTimer);
    // the sentence ends after a pause; wait a little longer if the phone hasn't finalised the last words yet
    if (text) sentTimer = setTimeout(commitSentence, interim ? gapMs() + 1200 : gapMs());
  }
  function takeUtter(){ clearTimeout(sentTimer); const t = currentText(); utter = { finals:'', interim:'' }; return t; }
  function commitSentence(){
    if (!listening || switching) return;
    const text = takeUtter();
    if (!text) return;
    heardThisTurn = true;
    handleFinal(text);
    if (isAuto()) { endTurn(); return; }
    // start a fresh recognizer session so the next sentence doesn't carry over earlier words
    if (!pausedForTts) { const old = rec; rec = null; try { old?.abort(); } catch {} startRec(); }
  }
  function scheduleLive(text){
    if (!S.liveOn) return;
    clearTimeout(liveTimer);
    liveTimer = setTimeout(async () => {
      const seq = ++liveSeq;
      liveCtl?.abort(); liveCtl = new AbortController();
      const { from, to } = pair(mode);
      try { const out = await translate(text, from, to, liveCtl.signal); if (seq === liveSeq) $('liveDst').textContent = out; } catch {}
    }, 250);
  }
  let pipeline = Promise.resolve();
  const latinRatio = t => { const l = (t.match(/[A-Za-z]/g) || []).length, h = (t.match(/[가-힣]/g) || []).length; return l / Math.max(1, l + h); };
  function handleFinal(text, who = mode){
    // auto mode: English picked up while listening for Korean is treated as the partner speaking
    if (isAuto() && who === 'me' && listening && latinRatio(text) > 0.6) who = 'them';
    clearTimeout(liveTimer); liveSeq++; liveCtl?.abort();
    $('liveSrc').textContent = '…'; $('liveDst').textContent = '';
    const { from, to } = pair(who);
    const turn = addTurn(who, text);
    // translate in order, so each sentence sees the one before it as context
    pipeline = pipeline.then(async () => {
      const r = await translateInContext(text, from, to).then(out => ({ out }), err => ({ err }));
      if (r.err) { turn.fail(r.err.message || '번역하지 못했어요'); return; }
      turn.set(r.out);
      convo.push({ who, src: text, out: r.out, t: Date.now() }); if (convo.length > 20) convo.shift();
      // auto + speaker: hold the voice until the speaker pauses, so it never talks over them or gets picked up
      if (isAuto() && listening && S.echoGuard && !switching) held.push([r.out, to.tts]); else speak(r.out, to.tts);
    });
  }
  function whenIdle(){
    return new Promise(res => {
      const t0 = Date.now();
      const iv = setInterval(() => {
        const busy = speaking > 0 || audioBusy || audioQ.length || (synth && (synth.speaking || synth.pending));
        if ((!busy && Date.now() - t0 > 300) || Date.now() - t0 > 45000) { clearInterval(iv); res(); }
      }, 120);
    });
  }
  async function endTurn(){
    if (!listening || switching) return;
    clearTimeout(turnTimer);
    const pending = takeUtter();
    if (pending) handleFinal(pending);
    switching = true; heardThisTurn = false;
    const old = rec; rec = null; try { old?.abort(); } catch {}
    $('liveSrc').textContent = ''; $('liveDst').textContent = '';
    paint();
    await pipeline;
    for (const [t, tag] of held.splice(0)) speak(t, tag);
    await whenIdle();
    switching = false; pausedForTts = false;
    if (!listening || !isAuto()) { paint(); return; }
    mode = mode === 'me' ? 'them' : 'me';
    try { navigator.vibrate?.(15); } catch {}
    startRec();
  }
  function startAuto(){
    if (!SR) { toast('이 브라우저는 음성 인식이 안 돼요. Chrome이나 Safari로 열어 주세요'); $('typeForm').hidden = false; return; }
    if (listening) { stopAll(); return; }
    listening = true; pausedForTts = false; switching = false; heardThisTurn = false; held = [];
    $('typeForm').hidden = true;
    restartFor(mode); wake();
  }
  function placeholder(){
    if (switching) return '';
    return mode === 'me' ? '편하게 말씀하세요…' : (isAuto() ? 'Go ahead, I\'m listening…' : '상대방이 말하면 바로 번역해요…');
  }
  function restartFor(m){ mode = m; try { rec?.abort(); } catch {} rec = null; startRec(); }
  function toggle(m){
    if (!SR) { toast('이 브라우저는 음성 인식이 안 돼요. Chrome이나 Safari로 열어 주세요'); $('typeForm').hidden = false; return; }
    if (listening && mode === m) { stopAll(); return; }
    listening = true; pausedForTts = false;
    $('typeForm').hidden = true;
    restartFor(m); wake();
  }
  function stopAll(){
    listening = false; pausedForTts = false; switching = false; heardThisTurn = false;
    clearTimeout(turnTimer);
    const pending = takeUtter();
    if (pending) handleFinal(pending);
    for (const [t, tag] of held.splice(0)) speak(t, tag);
    try { rec?.stop(); } catch {} rec = null;
    paint();
  }

  /* ---------- ui state ---------- */
  const SWAP_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h15l-4-4M20 16H5l4 4"/></svg>';
  function paint(){
    const auto = isAuto();
    const meOn = listening && mode === 'me', themOn = listening && mode === 'them';
    for (const b of document.querySelectorAll('.modes button')) b.setAttribute('aria-checked', String(b.dataset.mode === S.convMode));
    if (auto) {
      $('micBtn').classList.toggle('on', listening);
      $('micBtn').setAttribute('aria-label', listening ? '대화 끝내기' : '대화 시작');
      $('micLabel').textContent = listening ? '대화 끝내기' : '대화 시작';
      $('themBtn').classList.remove('on');
      $('themGlyph').innerHTML = SWAP_ICON;
      $('themLabel').textContent = '차례 바꾸기';
    } else {
      $('micBtn').classList.toggle('on', meOn);
      $('micBtn').setAttribute('aria-label', meOn ? '말하기 멈추기' : '말하기 시작');
      $('micLabel').textContent = meOn ? '누르면 멈춰요' : '눌러서 말하기';
      $('themBtn').classList.toggle('on', themOn);
      $('themGlyph').textContent = 'EN';
      $('themLabel').textContent = themOn ? '멈추기' : '영어 듣기';
    }
    const live = $('live');
    const wasHidden = live.hidden;
    live.hidden = !listening;
    if (wasHidden !== live.hidden && !chat.querySelector('.welcome')) requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
    live.classList.toggle('them-mode', themOn);
    if (listening) {
      let head;
      if (switching) head = speaking ? '통역 음성을 들려주는 중 · 곧 차례가 바뀌어요' : '통역하는 중…';
      else if (speaking) head = '통역 음성을 들려주는 중';
      else if (auto) head = meOn ? '내 차례 · 한국어로 말하세요' : '상대방 차례 · Please speak in English';
      else head = meOn ? '한국어를 듣고 있어요 → English' : 'English를 듣고 있어요 → 한국어';
      $('liveHead').textContent = head;
      const src = $('liveSrc').textContent;
      if (!src || src === '…' || /말씀하세요|번역해요|listening/.test(src)) $('liveSrc').textContent = placeholder();
    }
  }
  $('micBtn').onclick = () => isAuto() ? (listening ? stopAll() : (mode = 'me', startAuto())) : toggle('me');
  $('themBtn').onclick = () => {
    if (!isAuto()) return toggle('them');
    if (listening) { if (!switching) endTurn(); }
    else { mode = mode === 'me' ? 'them' : 'me'; toast(mode === 'me' ? '내 차례부터 시작해요' : '상대방 차례부터 시작해요'); startAuto(); }
  };
  for (const b of document.querySelectorAll('.modes button')) b.onclick = () => {
    if (S.convMode === b.dataset.mode) return;
    if (listening) stopAll();
    S.convMode = b.dataset.mode; save(); mode = 'me';
    if (chat.querySelector('.welcome')) welcome();
    paint();
    toast(isAuto() ? '자동 대화: 한 번 시작하면 차례를 알아서 바꿔요' : '직접 선택: 버튼으로 누가 말할지 골라요');
  };
  $('kbBtn').onclick = () => { const f = $('typeForm'); f.hidden = !f.hidden; if (!f.hidden) { if (listening) stopAll(); $('typeInput').focus(); } };
  $('typeForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('typeInput').value.trim(); if (!v) return;
    $('typeInput').value = ''; handleFinal(v, 'me');
  });

  let lock = null;
  async function wake(){ try { lock = await navigator.wakeLock?.request('screen'); } catch {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && listening) wake(); });

  /* ---------- settings ---------- */
  const dlg = $('settings'), form = dlg.querySelector('form');
  function fill(){
    $('rate').value = S.rate; $('rateVal').textContent = Number(S.rate).toFixed(1) + '×';
    $('gap').value = S.gap; $('gapVal').textContent = Number(S.gap).toFixed(1) + '초';
    $('liveOn').checked = S.liveOn; $('echoGuard').checked = S.echoGuard; $('ctxOn').checked = S.ctxOn;
    drawVoices();
  }
  $('openSettings').onclick = () => { fill(); dlg.showModal(); };
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  $('gap').oninput = () => { $('gapVal').textContent = Number($('gap').value).toFixed(1) + '초'; };
  $('rate').oninput = () => { $('rateVal').textContent = Number($('rate').value).toFixed(1) + '×'; };
  dlg.addEventListener('close', () => {
    Object.assign(S, { rate: Number($('rate').value), gap: Number($('gap').value), liveOn: $('liveOn').checked, echoGuard: $('echoGuard').checked, ctxOn: $('ctxOn').checked });
    save();
  });

  /* ---------- mobile fit ---------- */
  const root = document.documentElement, app = $('app'), dock = document.querySelector('.dock');
  const vv = window.visualViewport;
  let fullH = vv ? vv.height : innerHeight;
  function fit(){
    const h = vv ? vv.height : innerHeight;
    root.style.setProperty('--app-h', h + 'px');
    if (h > fullH) fullH = h;
    const kbOpen = fullH - h > 140 && document.activeElement?.tagName === 'INPUT' && !$('typeForm').hidden;
    app.classList.toggle('kb', kbOpen);
    window.scrollTo(0, 0);
    if (!chat.querySelector('.welcome')) chat.scrollTop = chat.scrollHeight;
  }
  vv?.addEventListener('resize', fit); vv?.addEventListener('scroll', () => window.scrollTo(0, 0));
  addEventListener('orientationchange', () => { fullH = 0; setTimeout(fit, 300); });
  new ResizeObserver(() => root.style.setProperty('--dock-h', dock.offsetHeight + 'px')).observe(dock);
  $('typeInput').addEventListener('focus', () => setTimeout(fit, 250));
  $('typeInput').addEventListener('blur', () => setTimeout(fit, 250));

  // iOS/Android only allow sound after a tap: unlock speech + audio on the first touch of a talk button
  let unlocked = false;
  function unlockAudio(){
    if (unlocked) return; unlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth?.speak(u); } catch {}
    try { const a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA='); a.play().catch(() => {}); } catch {}
  }
  const buzz = ms => { try { navigator.vibrate?.(ms); } catch {} };
  for (const id of ['micBtn','themBtn','kbBtn','bigPlay']) $(id).addEventListener('click', () => { unlockAudio(); buzz(id === 'micBtn' || id === 'themBtn' ? 25 : 10); });

  // swipe the settings sheet down to close it
  (() => {
    let y0 = null, dy = 0;
    const grab = dlg.querySelector('.grab'), sheet = dlg;
    grab.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; sheet.style.transition = 'none'; }, { passive:true });
    grab.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = `translateY(${dy}px)`; }, { passive:true });
    grab.addEventListener('touchend', () => { sheet.style.transition = ''; sheet.style.transform = ''; if (dy > 90) dlg.close(); y0 = null; });
  })();

  // Android back button closes overlays instead of leaving the app
  history.replaceState({ base:true }, '');
  function pushLayer(){ history.pushState({ layer:true }, ''); }
  addEventListener('popstate', () => {
    if (!$('big').hidden) { $('big').hidden = true; return; }
    if (dlg.open) { dlg.close(); return; }
  });
  $('openSettings').addEventListener('click', pushLayer);
  new MutationObserver(() => { if (!$('big').hidden) pushLayer(); }).observe($('big'), { attributes:true, attributeFilter:['hidden'] });

  // resume listening state cleanly when returning from another app
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && listening) stopAll(); });

  /* ---------- boot ---------- */
  fit(); welcome(); paint();
  if (!SR) { $('typeForm').hidden = false; toast('이 브라우저는 음성 인식이 안 돼요. 글자 입력으로 통역할 수 있어요'); }
})();
</script>
</body>
</html>
